[platformio]
default_envs = adafruit_feather_nrf52840

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed=115200
test_ignore = test_autorange

; Host-side unit tests for services/ (pure logic, no hardware).
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<services/>
build_flags = -Isrc -Wall -Wextra
