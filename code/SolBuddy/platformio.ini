[platformio]
default_envs = adafruit_feather_nrf52840

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed=115200
build_flags = -DBOARD_FEATHER_NRF52840
; hal/host is a PC-only stand-in for the hardware layer (unit tests).
build_src_filter = +<*> -<hal/host/>
; All tests so far are host-side (env:native); none run on the board.
test_ignore = *

; Host-side unit tests (pure logic, and drivers over hal/host fakes).
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<services/> +<drivers/MAX17048/> +<hal/host/>
build_flags = -Isrc -Wall -Wextra
